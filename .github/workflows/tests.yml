name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily live-data health check

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies (jsdom)
        run: npm ci

      - name: Syntax checks (all modules)
        run: |
          status=0
          while IFS= read -r f; do
            echo "checking $f"
            node --check "$f" || status=1
          done < <(git ls-files 'assets/**/*.js' 'test/*.mjs' 'worker/*.js')
          exit $status

      - name: Offline suites (required)
        run: |
          CC_OFFLINE=1 node test/verify.mjs
          CC_OFFLINE=1 node test/smoke.mjs

      - name: Live suites (best-effort — runner IPs are often blocked by card networks)
        continue-on-error: true
        run: |
          node test/verify.mjs || (sleep 20 && node test/verify.mjs)
          node test/smoke.mjs   || (sleep 20 && node test/smoke.mjs)
